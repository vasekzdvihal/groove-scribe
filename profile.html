<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My library - Groove Scribe</title>
    <link rel="icon" sizes="192x192" href="images/gscribe-icon-192.png">
    <link rel="stylesheet" href="css/profile.css">
  </head>
  <body>
    <header class="page-header">
      <a href="index.html">Groove Scribe</a>
      <div id="account"></div>
    </header>
    <main>
      <h1>My library</h1>
      <p id="message" role="alert" hidden></p>
      <section id="signedOut" hidden>
        <p>Sign in to keep your grooves in lessons and open them on any device.</p>
        <button id="signIn" type="button">Sign in with Google</button>
      </section>
      <section id="library" hidden>
        <form id="saveForm" class="panel">
          <label for="grooveLink">Add a groove link</label>
          <input id="grooveLink" type="text" autocomplete="off" required>
          <label for="grooveTitle">Title</label>
          <input id="grooveTitle" type="text" maxlength="200">
          <label for="saveLesson">Lesson</label>
          <select id="saveLesson"></select>
          <button type="submit">Save groove</button>
        </form>
        <form id="lessonForm" class="panel">
          <label for="lessonName">New lesson</label>
          <input id="lessonName" type="text" maxlength="200" required>
          <button type="submit">Create lesson</button>
        </form>
        <div id="lessons"></div>
      </section>
    </main>
    <script type="module" src="js/cloud/profilePage.js"></script>
  </body>
</html>
