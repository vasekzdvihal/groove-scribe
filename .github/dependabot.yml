version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Must match the Playwright image version in .github/workflows/ci-deploy.yml.
      - dependency-name: '@playwright/test'
      # A bump needs `npm run vendor:firebase` to regenerate js/vendor/firebase.js.
      - dependency-name: firebase
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-patch:
        update-types:
          - minor
          - patch
